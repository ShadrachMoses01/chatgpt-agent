[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-agent"
version = "0.1.0"
description = "ChatGPT agent bridge server — receives tool calls and dispatches execution"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
chatgpt-agent = "cli:main"

[tool.setuptools.packages.find]
include = ["bridge", "bridge.*"]

[tool.setuptools]
py-modules = ["runtime", "server", "cli"]
